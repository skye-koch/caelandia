<header class = 'site-header'>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" justify-center>
      <div class="container">
        <a class="navbar-brand mr-4" href="{% url 'home' %}">The Compendium</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-item nav-link active" href="{% url 'createEntry' %}">New Entry <span class="sr-only">(current)</span></a>
          </div>
          <div class = 'navbar-nav '>
          <form class="form-inline mr-2 my-lg-0 " method = POST action="{% url 'search' %}">
            {% csrf_token %}
            <input class="form-control mr-sm-2" type="search" placeholder="Find an Entry" aria-label="Search" name = "searched">
            <button class="btn btn-outline-primary my-2 my-sm-0" type="submit">Search</button>
          </form>
        </div>
        </div>
      </div>
      </nav>
</header>
